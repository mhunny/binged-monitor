name: Binged OTT Tracker

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

concurrency:
  group: binged-ott-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-notify:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Binged Scraper
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          python main.py

      - name: Save Updated Seen List
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f seen_titles.json ]; then
            echo "seen_titles.json does not exist."
            exit 0
          fi

          cp seen_titles.json /tmp/seen_titles.json

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/seen_titles.json seen_titles.json

          git add seen_titles.json

          if git diff --cached --quiet; then
            echo "No changes to seen_titles.json."
            exit 0
          fi

          git commit -m "Update seen titles"
          git push origin HEAD:main

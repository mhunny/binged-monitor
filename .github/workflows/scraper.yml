name: Binged OTT Tracker

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: binged-telegram
  cancel-in-progress: false

jobs:

  binged-telegram:

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Binged Telegram Tracker
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Save Seen Titles
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f seen_titles.json ]; then
            git add seen_titles.json

            if ! git diff --cached --quiet; then
              git commit -m "Update Binged seen titles"
              git push
            else
              echo "No seen-title changes."
            fi
          else
            echo "No seen_titles.json created."
          fi

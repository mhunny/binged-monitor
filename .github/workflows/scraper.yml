name: Binged OTT Tracker

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

concurrency:
  group: binged-ott-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium
          python -m playwright install --list

      - name: Verify Playwright
        run: |
          python -c "from playwright.sync_api import sync_playwright; print('Playwright Python OK')"

      - name: Run Binged Scraper
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python main.py

      - name: Save Updated Seen List
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f seen_titles.json ]; then
            echo "seen_titles.json does not exist."
            exit 0
          fi

          git add seen_titles.json

          if git diff --cached --quiet; then
            echo "No changes to seen_titles.json. Nothing to push."
            exit 0
          fi

          git fetch origin main
          git rebase origin/main

          git add seen_titles.json

          if git diff --cached --quiet; then
            echo "No changes after rebase. Nothing to push."
            exit 0
          fi

          git commit -m "Update seen titles"
          git push origin HEAD:main

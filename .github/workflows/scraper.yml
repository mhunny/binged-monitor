name: Binged OTT Tracker

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */2 * * *"

concurrency:
  group: binged-telegram
  cancel-in-progress: false

jobs:
  scrape-and-notify:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Restore Seen Titles
        uses: actions/cache/restore@v4
        with:
          path: seen_titles.json
          key: binged-seen-${{ github.run_id }}
          restore-keys: |
            binged-seen-

      - name: Run Binged Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Save Seen Titles
        uses: actions/cache/save@v4
        if: success()
        with:
          path: seen_titles.json
          key: binged-seen-${{ github.run_id }}

      - name: Upload Debug Screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: binged-debug
          path: binged_debug.png
          if-no-files-found: ignore
